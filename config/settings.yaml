app:
  name: "Enterprise AI Data Analyst"
  version: "2.5.0"
  storage_dir: "./storage"
  log_dir: "./logs"
  prompts_path: "./prompts/templates.yaml"

llm:
  model_name: "gemini-3.1-pro-preview"
  fallback_models:
    - "gemini-3-flash-preview"
    - "gemini-2.5-flash"
  temperature: 0.1
  max_output_tokens: 8192
  enable_cache: true

data:
  large_dataset_threshold: 1000000
  sample_size_for_llm: 5
  outlier_z_threshold: 3.0
  outlier_iqr_multiplier: 1.5
  max_categories_for_chart: 15